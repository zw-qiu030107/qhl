<!DOCTYPE html>
<html lang="zh-CN" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sober Tavern</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/notifications.css">
  <link rel="stylesheet" href="css/game-mode.css">
</head>
<body>

  <!-- ================================
       TOP NAVIGATION BAR
       ================================ -->
  <nav id="topnav">
    <!-- Logo -->
    <div class="nav-logo">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 2 L18 10 L10 18 L2 10 Z"/>
      </svg>
      <span class="nav-logo-text">Sober Tavern</span>
    </div>

    <!-- Game Mode Toggle -->
    <button id="btn-game-mode" title="切换到游戏模式" aria-pressed="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="3"/>
        <line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/>
        <line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/>
      </svg>
    </button>

    <!-- Right Nav Pills -->
    <div id="nav-right">
      <!-- 角色 Pill -->
      <div class="nav-pill-group">
        <button class="nav-pill" id="btn-character-manager">
          角色
          <svg class="pill-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="pill-dropdown">
          <button data-view="modal-char-manager">角色卡管理</button>
          <button data-view="modal-char-manager">导入角色卡</button>
          <button>导出当前角色</button>
        </div>
      </div>

      <!-- 历史 Pill -->
      <div class="nav-pill-group">
        <button class="nav-pill" id="btn-history">
          历史
          <svg class="pill-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="pill-dropdown">
          <button data-view="modal-chat-history">对话历史</button>
          <button>新建会话</button>
          <button>清空历史</button>
        </div>
      </div>

      <!-- 书签 Pill -->
      <div class="nav-pill-group">
        <button class="nav-pill" id="btn-bookmarks">
          书签
          <svg class="pill-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="pill-dropdown">
          <button data-view="modal-bookmarks">查看书签</button>
          <button>导出书签</button>
        </div>
      </div>

      <!-- 插件 Pill -->
      <div class="nav-pill-group">
        <button class="nav-pill" id="btn-plugins">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          <span>插件</span>
        </button>
      </div>

      <!-- 设置 Pill -->
      <div class="nav-pill-group">
        <button class="nav-pill" id="btn-settings">
          设置
          <svg class="pill-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="pill-dropdown">
          <button data-view="modal-settings">全局设置</button>
          <button>导出数据</button>
          <button>导入数据</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ================================
       APP MAIN - Three Column Layout
       ================================ -->
  <div id="app-main">

    <!-- ================================
         LEFT PANEL
         ================================ -->
    <aside id="left-panel">
      <!-- Character Switcher -->
      <div id="char-switcher-area">
        <button id="btn-char-switch">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <span id="btn-char-switch-label">导入角色卡</span>
        </button>
      </div>

      <!-- Avatar Section -->
      <div class="avatar-section">
        <div class="avatar-img">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <div class="char-name" id="char-name-display">未加载角色</div>
        <div class="char-subtitle" id="char-subtitle-display">请导入角色卡</div>

        <!-- Affection Mini Bar -->
        <div class="affection-mini">
          <div class="aff-row">
            <span class="aff-label">好感度</span>
            <span class="aff-value" id="aff-value">65</span>
          </div>
          <div class="aff-bar">
            <div class="aff-bar-fill" id="aff-bar-fill"></div>
          </div>
        </div>
      </div>

      <!-- Status Modules -->
      <div class="status-modules">
        <!-- 基本信息 -->
        <details open>
          <summary>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            基本信息
            <span class="summary-hint">女 / 16岁</span>
          </summary>
          <div class="module-body">
            <div class="field-row"><span class="field-label">姓名</span><span class="field-value" id="s-name">—</span></div>
            <div class="field-row"><span class="field-label">昵称</span><span class="field-value" id="s-nickname">—</span></div>
            <div class="field-row"><span class="field-label">年龄</span><span class="field-value" id="s-age">—</span></div>
            <div class="field-row"><span class="field-label">星座</span><span class="field-value" id="s-zodiac">—</span></div>
            <div class="field-row"><span class="field-label">性别</span><span class="field-value" id="s-gender">—</span></div>
            <div class="field-row"><span class="field-label">身高</span><span class="field-value" id="s-height">—</span></div>
            <div class="field-row"><span class="field-label">体重</span><span class="field-value" id="s-weight">—</span></div>
          </div>
        </details>

        <!-- 外观 -->
        <details>
          <summary>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            外观
            <span class="summary-hint">—</span>
          </summary>
          <div class="module-body">
            <div class="field-row"><span class="field-label">外貌</span><span class="field-value" id="s-appearance">—</span></div>
            <div class="field-row"><span class="field-label">表情</span><span class="field-value" id="s-expression">—</span></div>
            <div class="field-row"><span class="field-label">身体状态</span><span class="field-value" id="s-body">—</span></div>
          </div>
        </details>

        <!-- 心理 -->
        <details>
          <summary>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            心理
            <span class="summary-hint">—</span>
          </summary>
          <div class="module-body">
            <div class="inner-thought" id="s-inner-thought">—</div>
            <div class="section-label">动作</div>
            <div class="action-item"><span class="diamond">&#9670;</span><span id="s-action">—</span></div>
            <div class="section-label">计划</div>
            <div class="field-value" id="s-plan">—</div>
          </div>
        </details>

        <!-- 角色档案 -->
        <details>
          <summary>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            角色档案
            <span class="summary-hint">—</span>
          </summary>
          <div class="module-body">
            <div class="field-row"><span class="field-label">服装-外套</span><span class="field-value" id="s-outerwear">—</span></div>
            <div class="field-row"><span class="field-label">上衣</span><span class="field-value" id="s-top">—</span></div>
            <div class="field-row"><span class="field-label">内衣</span><span class="field-value" id="s-inner-top">—</span></div>
            <div class="field-row"><span class="field-label">下衣</span><span class="field-value" id="s-bottom">—</span></div>
            <div class="field-row"><span class="field-label">内裤</span><span class="field-value" id="s-underwear">—</span></div>
            <div class="field-row"><span class="field-label">袜子</span><span class="field-value" id="s-socks">—</span></div>
            <div class="field-row"><span class="field-label">鞋子</span><span class="field-value" id="s-shoes">—</span></div>
            <div class="field-row"><span class="field-label">配饰</span><span class="field-value" id="s-accessories">—</span></div>
            <div class="divider-thin"></div>
            <div class="field-row"><span class="field-label">周围人物</span><span class="field-value" id="s-surrounding">—</span></div>
            <div class="field-row"><span class="field-label">地点</span><span class="field-value" id="s-location">—</span></div>
          </div>
        </details>
      </div>
    </aside>

    <!-- ================================
         CENTER - Chat Area
         ================================ -->
    <div id="chat-area">
      <div id="chat-messages"></div>

      <!-- Input Bar (inside #chat-area) -->
      <div id="input-bar">
        <!-- Action Menu -->
        <div class="action-menu-wrap">
          <button id="btn-actions" title="操作">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div id="action-menu" class="action-menu">
            <button id="act-regenerate">重新生成</button>
            <button id="act-continue">继续写</button>
            <button id="act-undo">撤回</button>
            <button id="act-clear">清空对话</button>
          </div>
        </div>

        <textarea id="msg-input" class="msg-input" placeholder="输入你的消息..." rows="1"></textarea>
        <span id="token-count-display" class="token-count">Token: 0/4096</span>
        <button id="btn-send" title="发送">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ================================
         CENTER - Game Area (initially hidden)
         ================================ -->
    <div id="game-area">
      <div id="game-maintext"></div>
      <div id="game-options"></div>
      <details id="game-thinking">
        <summary>
          <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          <span class="thinking-label">思考过程</span>
        </summary>
        <div class="game-thinking-body"></div>
      </details>
      <div id="game-vars"></div>
    </div>

    <!-- ================================
         RIGHT PANEL
         ================================ -->
    <aside id="right-panel">
      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="tab-character">角色设定</button>
        <button class="tab-btn" data-tab="tab-worldbook">世界书</button>
        <button class="tab-btn" data-tab="tab-settings">对话设置</button>
        <button class="tab-btn" data-tab="tab-regex">正则</button>
      </div>

      <!-- Tab: 角色设定 -->
      <div class="tab-content active" id="tab-character">
        <div class="char-field">
          <label>姓名</label>
          <input type="text" id="cs-name" value="" placeholder="角色名称">
        </div>
        <div class="char-field">
          <label>昵称</label>
          <input type="text" id="cs-nickname" value="" placeholder="昵称">
        </div>
        <div class="char-field">
          <label>年龄</label>
          <input type="number" id="cs-age" value="16" min="1" max="200">
        </div>
        <div class="char-field">
          <label>星座</label>
          <input type="text" id="cs-zodiac" value="" placeholder="星座">
        </div>
        <div class="char-field">
          <label>性格</label>
          <textarea id="cs-personality" rows="3" placeholder="角色的性格描述..."></textarea>
        </div>
        <div class="char-field">
          <label>喜好</label>
          <textarea id="cs-likes" rows="2" placeholder="角色的喜好..."></textarea>
        </div>
        <div class="char-field">
          <label>背景</label>
          <textarea id="cs-background" rows="3" placeholder="角色的背景故事..."></textarea>
        </div>
        <div class="char-field">
          <label>关系</label>
          <textarea id="cs-relationship" rows="2" placeholder="与用户的关系..."></textarea>
        </div>
      </div>

      <!-- Tab: 世界书 -->
      <div class="tab-content" id="tab-worldbook">
        <div class="wb-toolbar">
          <span class="wb-count" id="wb-count">0 条条目</span>
          <div class="wb-actions">
            <button class="btn-add" id="wb-add">+ 新建</button>
            <button id="wb-import">导入</button>
            <button id="wb-export">导出</button>
          </div>
        </div>
        <div id="wb-list"></div>
      </div>

      <!-- Tab: 对话设置 -->
      <div class="tab-content" id="tab-settings">
        <div class="char-field">
          <label>Temperature <span id="temperature-val" class="range-val-display">1.0</span></label>
          <input type="range" id="cs-temperature" min="0" max="2" step="0.1" value="1.0">
        </div>
        <div class="char-field">
          <label>Top P <span id="topp-val" class="range-val-display">0.90</span></label>
          <input type="range" id="cs-topp" min="0" max="1" step="0.01" value="0.9">
        </div>
        <div class="char-field">
          <label>Max Tokens</label>
          <input type="number" id="cs-max-tokens" value="512" min="1" max="32768">
        </div>
        <div class="char-field">
          <label>作者注记频率</label>
          <input type="number" id="cs-an-frequency" value="0" min="0" max="4">
          <div id="an-warning" class="an-warning-msg hidden">频率为 0 时，作者注记不会自动插入。</div>
        </div>
        <div class="char-field">
          <label>流式输出</label>
          <button id="cs-streaming" class="toggle-btn" aria-checked="false">
            <span class="toggle-thumb"></span>
          </button>
        </div>
      </div>

      <!-- Tab: 正则 -->
      <div class="tab-content" id="tab-regex"></div>
    </aside>

  </div><!-- /#app-main -->

  <!-- ================================
       MODAL OVERLAY
       ================================ -->
  <div id="modal-overlay" class="modal-overlay hidden">

    <!-- 1. 角色卡管理 -->
    <div id="modal-char-manager" class="modal wide hidden">
      <div class="modal-header">
        <h3>角色卡管理</h3>
        <button class="modal-close view-close" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="char-drop-zone" class="drop-zone">
          <p>拖拽角色卡文件到此区域（支持 JSON / PNG）</p>
        </div>
        <input type="file" id="char-file-input" accept=".json,.png" hidden>
        <div id="char-card-list" class="char-card-list-modal"></div>
      </div>
      <div class="modal-footer">
        <button id="btn-new-char" class="btn btn-primary">新建角色卡</button>
      </div>
    </div>

    <!-- 2. 编辑角色卡 -->
    <div id="modal-char-editor" class="modal wide hidden">
      <div class="modal-header">
        <div class="modal-header-left">
          <button class="view-back" title="返回">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <h3>编辑角色卡</h3>
        </div>
        <div class="modal-header-right">
          <button id="editor-toggle-view" class="btn btn-sm btn-secondary">JSON 视图</button>
          <button class="modal-close view-close" title="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <div id="editor-form-view" class="char-editor-form">
          <div class="editor-field">
            <label>名称</label>
            <input type="text" id="editor-name" placeholder="角色名称">
          </div>
          <div class="editor-field">
            <label>描述</label>
            <input type="text" id="editor-description" placeholder="简短描述">
          </div>
          <div class="editor-field">
            <label>性格</label>
            <textarea id="editor-personality" class="tall" placeholder="角色性格描述..."></textarea>
          </div>
          <div class="editor-field">
            <label>场景</label>
            <textarea id="editor-scenario" class="tall" placeholder="角色所在场景..."></textarea>
          </div>
          <div class="editor-field">
            <label>首次消息</label>
            <textarea id="editor-first-mes" class="x-tall" placeholder="角色的第一条消息..."></textarea>
          </div>
          <div class="editor-field">
            <label>消息示例</label>
            <textarea id="editor-mes-example" class="x-tall" placeholder="角色对话示例..."></textarea>
          </div>
          <div class="editor-field">
            <label>话痨程度</label>
            <div class="range-row">
              <input type="range" id="editor-talkativeness" min="0" max="100" value="50">
              <span class="range-value" id="editor-talkativeness-val">50</span>
            </div>
          </div>
          <div class="editor-field">
            <label>标签</label>
            <div id="editor-tags-container" class="tags-container">
              <input type="text" class="tag-input-inline" id="editor-tags-input" placeholder="输入标签后按回车...">
            </div>
          </div>
        </div>
        <div id="editor-json-view" hidden>
          <textarea id="editor-json-textarea" class="json-editor-textarea" placeholder="编辑 JSON..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="editor-save" class="btn btn-primary">保存</button>
      </div>
    </div>

    <!-- 3. 对话历史 -->
    <div id="modal-chat-history" class="modal wide hidden">
      <div class="modal-header">
        <h3>对话历史</h3>
        <button class="modal-close view-close" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="history-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger">清空全部历史</button>
      </div>
    </div>

    <!-- 4. 书签 -->
    <div id="modal-bookmarks" class="modal wide hidden">
      <div class="modal-header">
        <h3>我的书签</h3>
        <button class="modal-close view-close" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="bookmark-list"></div>
      </div>
    </div>

    <!-- 5. 全局设置 -->
    <div id="modal-settings" class="modal hidden">
      <div class="modal-header">
        <h3>全局设置</h3>
        <button class="modal-close view-close" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="editor-field">
          <label>主题</label>
          <select id="setting-theme">
            <option value="default">默认</option>
            <option value="darker">深黑</option>
          </select>
        </div>
        <div class="editor-field">
          <label>字体大小</label>
          <select id="setting-font-size">
            <option value="small">小</option>
            <option value="medium" selected>中</option>
            <option value="large">大</option>
          </select>
        </div>
        <div class="editor-field">
          <label>气泡样式</label>
          <select id="setting-bubble-style">
            <option value="default">默认</option>
            <option value="rounded">圆角</option>
            <option value="flat">扁平</option>
          </select>
        </div>
        <hr class="modal-divider">
